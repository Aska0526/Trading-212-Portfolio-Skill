name: release

# A release is created only when main changes (merge or push), or when run
# manually from the Actions tab. Feature and dev branches never release.
#
# Version: the first release uses the version in Cargo.toml. After that, each
# release bumps the latest v* tag (patch by default; choose minor or major
# when running manually). The version is stamped into the build here, so no
# version-bump commits are needed on main.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      skip: ${{ steps.next.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' Cargo.toml | head -n1)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="$((major + 1)).0.0" ;;
              minor) next="$major.$((minor + 1)).0" ;;
              *)     next="$major.$minor.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing v$next (previous: ${last:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - if: matrix.target != 'x86_64-apple-darwin'
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
      - name: Stamp version
        run: |
          perl -0pi -e 's/(\[workspace\.package\]\nversion = ")[^"]*"/${1}${{ needs.version.outputs.version }}"/' Cargo.toml
          grep -A1 '^\[workspace.package\]' Cargo.toml
      - run: cargo build --release --target ${{ matrix.target }} -p t212-cli
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf "$GITHUB_WORKSPACE/t212-${{ matrix.target }}.tar.gz" t212
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 t212-${{ matrix.target }}.tar.gz > t212-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: t212-${{ matrix.target }}
          path: t212-${{ matrix.target }}.tar.gz*

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
